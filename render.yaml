# Blueprint de Render para desplegar NUESTRO backend (urab-ai-api).
#
# Uso (una sola vez, desde el dashboard de Render, con tu propia cuenta):
#   1. New  →  Blueprint  →  conectar este repositorio de GitHub.
#   2. Render lee este archivo y crea el servicio "urab-ai-api" desde la
#      rama App-bien-hecha (NUNCA main).
#   3. Al crear, pega el valor de ANTHROPIC_API_KEY (marcado sync:false, no
#      queda en el repo).
#   4. Copia la URL que te da Render (p. ej. https://urab-ai-api-xxxx.onrender.com)
#      y ponla como VITE_API_URL en los proyectos de Vercel de los portales;
#      redeploy de los fronts y listo.
#
# El contenedor es persistente (SQLite vive mientras corre la instancia), igual
# que el despliegue actual. Para persistencia total entre reinicios, añadir un
# disco de Render o un Postgres y setear DATABASE_URL.

services:
  - type: web
    name: urab-ai-api
    runtime: docker
    branch: App-bien-hecha
    rootDir: urab-ai-api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: URAB_MODEL
        value: claude-haiku-4-5-20251001
      - key: USAR_ORQUESTADOR
        value: "1"
